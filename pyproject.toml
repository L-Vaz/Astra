[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foamagent"
version = "2.0.0"
description = "Multi-agent framework that automates CFD simulations in OpenFOAM using natural language prompts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Foam-Agent Team"},
]
keywords = ["openfoam", "cfd", "mcp", "llm", "agent", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0",
    # Per-session advisory lock for the design-session store (S1-B2). Previously only
    # a transitive dependency (huggingface-hub); the store now depends on it directly.
    "filelock>=3.12",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "langgraph>=0.2",
    "faiss-cpu>=1.7",
    "openai>=1.0",
    "anthropic>=0.20",
    "uvicorn>=0.30",
    "pyvista>=0.44",
    "aerosandbox>=4.2",
    "neuralfoil>=0.3",
]

[project.optional-dependencies]
hpc = ["boto3"]
ollama = ["langchain-ollama>=0.3", "ollama>=0.4"]
bedrock = ["langchain-aws>=0.2", "boto3"]
all = ["foamagent[hpc,ollama,bedrock]"]

[project.scripts]
foamagent-mcp = "src.mcp.cli:main"

[project.urls]
Homepage = "https://github.com/csml-rpi/Foam-Agent"
Repository = "https://github.com/csml-rpi/Foam-Agent"
Issues = "https://github.com/csml-rpi/Foam-Agent/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns a mistyped marker into an error instead of a silent no-op.
addopts = "--strict-markers --strict-config"
# The xfail backlog is only a backlog if a fixed defect fails the run. Without this, an
# xfail that starts passing reports XPASS and stays green, so "broken" and "quietly
# fixed" look identical. Markers set strict=True individually too; this makes it the
# default so a new one cannot forget.
xfail_strict = true
# Our own deprecations are errors — they are ours to fix. Third-party sunset warnings
# (langchain-community, starlette's testclient) are NOT blanket-errored: that would fail
# the suite on a dependency's release schedule rather than on anything we changed.
filterwarnings = [
    "error::DeprecationWarning:domain_packs",
    "error::DeprecationWarning:src",
]
markers = [
    "slow: long-running sweeps (large hypothesis profiles, full-envelope grids)",
    "wsl: needs the WSL FoamAgent env (imports src/, loads FAISS ~30s)",
    "js: runs a Node ES-module parity check under tests/js/",
]
# A shrinking suite must not look like a passing one. tests/conftest.py prints the
# collected count and any opted-out modules on every full run, and fails the run if
# the count drops below this floor. Module-level skips remove their tests from
# collection, so this floor covers only the environment-independent core (the tests
# that collect even without the services layer). Raise it when tests are added.
minimum_collected_tests = "510"

[tool.setuptools.packages.find]
include = ["src", "src.*", "domain_packs", "domain_packs.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]
"domain_packs.bwb" = ["data/*.csv", "data/*.json"]
"src.cockpit" = ["static/*.js", "static/*.css", "static/*.html"]
